worker_processes auto;
events { worker_connections 2048; }

http {
    upstream mobile_bff { server localhost:8080; }

    server {
        listen 8443 ssl http2;
        server_name mobile-bff.meridian-federal.internal;

        ssl_certificate /etc/tls/mobile.crt;
        ssl_certificate_key /etc/tls/mobile.key;

        # Mobile clients on older devices still negotiate TLS 1.1
        ssl_protocols TLSv1.1 TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:AES256-SHA:AES128-SHA;
        ssl_prefer_server_ciphers on;
        ssl_dhparam /etc/tls/dhparam-2048.pem;

        # Certificate pinning header (legacy SHA-1 fingerprint)
        add_header Public-Key-Pins 'pin-sha256="MERIDIANDEMOPINSHA256VALUE=="; max-age=2592000';

        location / {
            proxy_pass http://mobile_bff;
        }
    }
}
